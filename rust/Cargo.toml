[workspace]
resolver = "2"
members = [
    "athena-federation-sdk",
    "athena-federation-substrait",
    "athena-jdbc",
    "athena-postgresql",
    "athena-snowflake",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
arrow = { version = "60", features = ["ipc"] }
arrow-schema = "60"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", default-features = false }
chrono = "0.4"
chrono-tz = "0.10"
bigdecimal = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
indexmap = "2"
proptest = "1"
aes-gcm = "0.11"
getrandom = "0.3"
aws-config = "1"
async-trait = "0.1"
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-sdk-s3 = "1"
aws-sdk-kms = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-athena = "1"
aws-sdk-glue = "1"
aws-sdk-sts = "1"
lambda_runtime = { version = "1.5", default-features = false }
aws-esdk = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
athena-federation-sdk = { path = "athena-federation-sdk" }
athena-federation-substrait = { path = "athena-federation-substrait" }
athena-jdbc = { path = "athena-jdbc" }
athena-postgresql = { path = "athena-postgresql" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
sha2 = "0.11"
postgres-protocol = "0.6.12"
fallible-iterator = "0.2"
athena-snowflake = { path = "athena-snowflake" }
snowflake-connector-rs = { version = "=1.1.1", default-features = false, features = ["key-pair-auth", "pkcs8-3des"] }
pkcs8 = { version = "0.10", features = ["encryption", "pem", "3des", "sha1-insecure", "std"] }
rsa = "0.9"
des = "0.8"
cbc = "0.1"
rc2 = "0.8"
rc4 = "0.1"
md2 = "0.11"
sha1 = "0.11"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
bytes = "1"
url = "2.5"
prost = { version = "0.14.6", features = ["no-recursion-limit"] }
prost-types = "0.14.6"
prost-build = "0.14.6"
protox = "0.9.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
