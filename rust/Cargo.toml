[workspace]
resolver = "2"
members = ["athena-federation-sdk", "athena-federation-substrait"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
arrow = { version = "60", features = ["ipc"] }
arrow-schema = "60"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
chrono-tz = "0.10"
bigdecimal = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
indexmap = "2"
proptest = "1"
